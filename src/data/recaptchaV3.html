<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <script src="https://www.google.com/recaptcha/api.js?render=<site-key>" async defer></script>
    <script>
        // Signal when grecaptcha is ready
        window.__recaptchaReady = false;
        var checkIv = setInterval(function() {
            if (window.grecaptcha && typeof window.grecaptcha.execute === 'function') {
                window.__recaptchaReady = true;
                clearInterval(checkIv);
            }
        }, 200);
        setTimeout(function() { clearInterval(checkIv); }, 25000);
    </script>
</body>
</html>
