<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <script src="https://www.google.com/recaptcha/api.js?render=<site-key>&onload=onloadRecaptchaCallback" async defer></script>
    <script>
        window.__recaptchaReady = false;
        window.onloadRecaptchaCallback = function() {
            // Poll until execute is available (api.js loads async)
            var iv = setInterval(function() {
                if (window.grecaptcha && typeof window.grecaptcha.execute === 'function') {
                    window.__recaptchaReady = true;
                    clearInterval(iv);
                }
            }, 200);
            setTimeout(function() { clearInterval(iv); }, 20000);
        };
    </script>
</body>
</html>
